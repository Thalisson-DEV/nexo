# PWA Nexo Field App — config Nginx (servida como template).
# Copiada no Dockerfile para /etc/nginx/templates/default.conf.template; a imagem
# oficial do Nginx roda `envsubst` nos *.template no startup. Defina no ambiente
# NGINX_ENVSUBST_FILTER=PORT para que SOMENTE ${PORT} seja substituída (preservando
# $uri, $host e demais variáveis internas do Nginx).

# Suporte a WebSocket (backend usa STOMP/SockJS). Map em contexto http — este
# arquivo é incluído dentro do bloco http {} da imagem oficial do Nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- COMPRESSÃO ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm
        font/woff2;

    # ---------- SERVICE WORKER: NUNCA CACHEAR ----------
    # Estes arquivos controlam a detecção de updates. Cachear = app travado em versão antiga.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /worker-basic.min.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- MANIFEST ----------
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type "application/manifest+json";
    }

    # ---------- INDEX: NUNCA CACHEAR ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- ASSETS COM HASH: cache imutável ----------
    location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- API REVERSE PROXY (rede privada Railway) ----------
    # O PWA usa apiBaseUrl '/api' (mesma origem) — aqui repassamos para o backend
    # ces-backend, que escuta em :8080 com context path '/api' na rede privada.
    #
    # Detalhes importantes:
    #  - Rede privada do Railway é IPv6; o resolver interno é [fd12::10].
    #  - Os IPs privados mudam a cada redeploy do backend, por isso usamos uma
    #    variável no proxy_pass + resolver com valid=1s, forçando o Nginx a
    #    re-resolver o DNS (sem isso o Nginx cacheia o IP no boot e quebra).
    #  - proxy_pass SEM URI após a variável => a URI original ('/api/v1/...') é
    #    repassada intacta, casando com o context path '/api' do backend.
    #  - Tráfego interno é http:// (já criptografado via Wireguard pelo Railway).
    location ^~ /api/ {
        # A aplicacao aceita anexos de ate 15 MB. O padrao do Nginx e 1 MB e
        # rejeitava fotos reais com 413 antes da requisicao chegar ao backend.
        # A folga cobre os metadados do envelope multipart/form-data.
        client_max_body_size 20m;

        resolver [fd12::10] ipv6=on valid=1s;
        set $ces_backend "ces-backend.railway.internal:8080";
        proxy_pass http://$ces_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SockJS
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- SPA FALLBACK ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- SEGURANÇA ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
