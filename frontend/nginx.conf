# map em nível http (conf.d é incluído dentro de http{})
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Railway: o edge encaminha para a "target port" fixada no domínio.
    # Este serviço foi criado na era RAILPACK (target port 8080); o nginx
    # escuta em 80 e 8080 para casar com qualquer configuração do edge.
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- COMPRESSÃO GZIP ----------
    gzip on;
    gzip_vary on;                # avisa caches/CDN que varia por Accept-Encoding
    gzip_proxied any;
    gzip_comp_level 6;           # 6 é o sweet-spot CPU x tamanho
    gzip_min_length 1024;        # não comprime arquivos minúsculos (overhead)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;
    # NUNCA listar image/png, image/jpeg, woff (já comprimidos)

    # ---------- ASSETS COM HASH: cache longo ----------
    # Angular gera nomes com hash (main.abc123.js) → safe p/ cache imutável
    # NOTA: como este bloco define add_header próprio, os headers de segurança
    # do nível server NÃO são herdados — por isso são repetidos aqui.
    location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---------- INDEX SEM CACHE ----------
    # idem: headers de segurança repetidos por causa da herança do add_header
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Healthcheck do caminho público: confirma que o proxy está vivo sem consultar
    # o backend nem cair no fallback da SPA. A resposta nunca deve ser cacheada.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"status":"UP"}';
    }

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"status":"UP"}';
    }

    # Contratos técnicos, Actuator e o endpoint legado nunca são públicos pelo
    # proxy do frontend. O monitor acessa-os pela rede privada autorizada.
    location ^~ /api/internal/ { return 404; }
    location ^~ /api/actuator/ { return 404; }
    location ^~ /api/v1/status { return 404; }

    # ---------- PROXY PARA O BACKEND (rede privada do Railway) ----------
    # ces-backend escuta na porta 8080 com context path /api (Tomcat).
    # Tráfego interno usa http:// (já cifrado por Wireguard).
    #
    # Re-resolução em runtime: ao usar uma VARIÁVEL no proxy_pass (em vez do
    # hostname literal), o nginx deixa de resolver o IP só no boot e passa a
    # consultar o DNS a cada TTL. Assim, quando o ces-backend é redeployado e
    # ganha um novo IP interno, este serviço NÃO precisa mais ser reiniciado.
    #   - resolver [fd12::10] -> DNS interno da rede privada do Railway (IPv6).
    #     É o resolver oficial e funciona em QUALQUER versão do nginx.
    #   - ipv6=on            -> a rede privada do Railway resolve via IPv6.
    # IMPORTANTE: com variável no proxy_pass é preciso anexar $request_uri
    # explicitamente, senão o nginx não repassa a query string (?page=&size=).
    location /api/ {
        resolver [fd12::10] valid=10s ipv6=on;
        set $ces_backend ces-backend.railway.internal;
        proxy_pass http://$ces_backend:8080$request_uri;

        # ---------- CORPO DE REQUISIÇÃO (uploads de anexo) ----------
        # SEM esta diretiva o nginx aplica o default de 1 MB e devolve 413 sozinho,
        # sem nunca encostar no backend — que aceita 15 MB por arquivo / 20 MB por
        # requisição (spring.servlet.multipart no application.yaml). Era exatamente
        # esse descompasso que fazia o anexo de desconto falhar "às vezes": foto de
        # celular passa fácil dos 2 MB, print de tela não passa. O teto aqui é
        # deliberadamente maior que o do backend, para que quem recusa o arquivo
        # grande seja o Spring — que responde Problem Details legível — e não o
        # nginx, que responde uma página HTML que o frontend não sabe interpretar.
        client_max_body_size 25m;
        client_body_buffer_size 1m;    # evita o warn de buffer em disco nos anexos comuns
        client_body_timeout 120s;      # link de campo é lento; 60s (default) estoura no meio do upload

        # Upload é fluxo longo: o default de 60s corta o envio de arquivos grandes.
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;            # WebSocket SockJS /api/ws (telemetria de frota)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- DESCOBERTA OAUTH (conexões de IA via MCP) ----------
    # Claude, ChatGPT, Cursor etc. procuram os metadados na raiz do endereço público
    # (RFC 8414 / RFC 9728). O backend os publica em /api/.well-known/.
    location ^~ /.well-known/oauth- {
        resolver [fd12::10] valid=10s ipv6=on;
        set $ces_backend ces-backend.railway.internal;
        proxy_pass http://$ces_backend:8080/api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SOCKJS (notificações em tempo real) ----------
    # Sessões longas: o WebSocket fica aberto e os transportes de reserva (xhr_streaming,
    # eventsource) só funcionam se cada frame passar na hora. Com o buffer padrão do nginx
    # o streaming nunca entregava o preâmbulo e o cliente descia para long-polling.
    location ^~ /api/ws/ {
        resolver [fd12::10] valid=10s ipv6=on;
        set $ces_backend ces-backend.railway.internal;
        proxy_pass http://$ces_backend:8080$request_uri;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA FALLBACK ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- HEADERS DE SEGURANÇA ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
