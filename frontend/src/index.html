  <!-- Inicialização Imediata do Tema (Previne FOUC e garante tema persistido no navegador) -->
  <script>
    try {
      var savedTheme = localStorage.getItem('ces_theme_mode');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('app-dark', 'dark');
      } else if (savedTheme === 'light') {
        document.documentElement.classList.remove('app-dark', 'dark');
      }
    } catch (e) {}
  </script>

  <!--
    sockjs-client (usado pelo STOMP de notificações e de telemetria de frota) é um pacote
    CommonJS que espera o `global` do Node. Sem este apelido o bundle quebra no boot com
    "global is not defined". Precisa vir antes de qualquer script da aplicação.
  -->
