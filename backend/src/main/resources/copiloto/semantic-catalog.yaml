glossario:
  - termo: Saída de material
    sinonimos: [saída, saídas, consumo, retirada, baixa, material usado]
    definicao: Saídas brutas de material incluem ENTREGA, APLICACAO, RETIRADA e BAIXA_AVULSA. DEVOLUCAO e ESTORNO reduzem o consumo líquido; TRANSFERENCIA e ENTRADA_AVULSA não representam consumo. Ao comparar períodos, explicite se o cálculo é bruto ou líquido.
    fontes: [movimentacoes]
  - termo: SLA de reservas e retiradas
    sinonimos: [SLA, prazo de retirada, estourar o prazo, vencendo]
    definicao: Solicitacoes tecnicas tem data prevista de retirada. A reserva esta ATRASADA quando a data passou sem entrega e VENCE_EM_ATE_2_DIAS quando faltam ate 2 dias. O prazo recomendado entre pedido e saque e de 48h (fora_prazo_saque).
    fontes: [reservas, solicitacoes]
  - termo: Entrega parcial expirada
    sinonimos: [parcial, saldo pendente]
    definicao: Uma entrega parcial (ENTREGUE_PARCIAL) expira 72h apos a entrega; o saldo pendente e encerrado automaticamente.
    fontes: [solicitacoes, reservas]
  - termo: Tipo tecnico
    sinonimos: ["221", "921", "222", "922", adicao, devolucao, concreto]
    definicao: 221 = ADICAO_COMUM, 921 = ADICAO_CONCRETO, 222 = DEVOLUCAO_COMUM, 922 = DEVOLUCAO_CONCRETO.
    fontes: [solicitacoes, movimentacoes, reservas]
  - termo: Contexto da solicitacao
    sinonimos: [comercial, tecnico]
    definicao: COMERCIAL atende equipes de servico; TECNICO atende obras (com planejamento, reserva e separacao).
    fontes: [solicitacoes]
  - termo: Condicao do material
    sinonimos: [novo, sucata]
    definicao: NOVO e material apto ao uso; SUCATA e material retirado/danificado controlado separadamente no saldo.
    fontes: [saldos, movimentacoes]
  - termo: Ciclo do desconto
    sinonimos: [desconto em folha, baixa, validacao]
    definicao: SOLICITADO -> VALIDADO (valor confirmado) -> BAIXADO (efetivamente descontado); pode ser REJEITADO. O valor efetivo e o baixado.
    fontes: [descontos, descontos_itens]
  - termo: Ciclo das solicitacoes financeiras
    sinonimos: [aprovacao de compra, aprovacao de pagamento]
    definicao: RASCUNHO (em preenchimento) -> SOLICITADO (aguardando aprovacao) -> APROVADO ou REJEITADO; pode ser CANCELADO. Compras aprovadas podem originar solicitacoes de pagamento.
    fontes: [solicitacoes_compra, solicitacoes_pagamento]
  - termo: SLA de chamados
    sinonimos: [primeira resposta, resolucao, estouro de SLA]
    definicao: Cada topico define prazos de primeira resposta e resolucao; o SLA de resolucao pausa enquanto aguarda o solicitante. FECHADO e CANCELADO sao finalizados.
    fontes: [chamados]
  - termo: Eventos de SST nos indicadores
    sinonimos: [acidentalidade, taxa de acidentes]
    definicao: Eventos CANCELADOS nao contam nos indicadores; a contagem usa a data da ocorrencia. Para indicadores oficiais prefira as metricas oficiais de SST.
    fontes: [eventos_sst]
  - termo: Obra atrasada
    sinonimos: [atraso de obra, fora do prazo]
    definicao: Obra sem data de fim efetiva, com status nao concluido e previsao de fim no passado.
    fontes: [obras]
  - termo: Processo em inspeções e desvios de SST
    sinonimos: [processo do inspetor, processo na inspeção, processo no desvio, processo SST]
    definicao: Em inspeções e desvios de segurança (SST), o processo de negócio associado refere-se sempre ao processo do inspetor (quem realizou a inspeção), e não ao do colaborador inspecionado.
    fontes: [inspecoes, desvios]
