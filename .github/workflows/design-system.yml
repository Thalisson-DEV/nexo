name: Design System

on:
  pull_request:
    paths:
      - 'frontend/src/app/design-system/**'
      - 'frontend/src/app/shared/components/**'
      - 'frontend/src/styles.css'
      - 'frontend/docs/design-system/**'
      - 'frontend/tools/design-system/**'
      - 'frontend/e2e/design-system/**'
      - 'frontend/playwright.config.ts'
      - 'frontend/vitest-base.config.ts'
      - 'frontend/angular.json'
      - 'frontend/package*.json'
      - 'frontend/AGENTS.md'
      - 'frontend/CLAUDE.md'
      - '.github/workflows/design-system.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/app/design-system/**'
      - 'frontend/src/app/shared/components/**'
      - 'frontend/src/styles.css'
      - 'frontend/docs/design-system/**'
      - 'frontend/tools/design-system/**'
      - 'frontend/e2e/design-system/**'
      - 'frontend/playwright.config.ts'
      - 'frontend/vitest-base.config.ts'
      - 'frontend/angular.json'
      - 'frontend/package*.json'
      - 'frontend/AGENTS.md'
      - 'frontend/CLAUDE.md'
      - '.github/workflows/design-system.yml'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify Design System Nexo
        run: npm run verify:design-system
        env:
          # O builder compila todos os specs antes de rodar; com o heap padrão o processo cai
          # no meio da suíte. O isolamento por arquivo dos testes está em vitest-base.config.ts.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
