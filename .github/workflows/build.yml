name: Application builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'observability/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        application: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag ces-${{ matrix.application }}:ci ./${{ matrix.application }}

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: observability/probes/go.sum
      - name: Test adapter and probes
        working-directory: observability/probes
        run: go test ./...
      - name: Validate synthetic runner
        working-directory: observability/synthetics
        run: npm ci && npm run check
      - name: Validate catalog coverage
        shell: pwsh
        working-directory: observability
        run: ./scripts/validate_catalog.ps1
      - name: Validate Compose contracts
        working-directory: observability
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file sentinel/.env.example --file sentinel/compose.yaml config --quiet
      - name: Build observability images with fake transport
        working-directory: observability
        env:
          ALERT_TRANSPORT: fake
        run: |
          docker build --tag ces-gatus:ci ./gatus
          docker build --tag ces-observability-probes:ci ./probes
          docker build --tag ces-observability-synthetics:ci ./synthetics
